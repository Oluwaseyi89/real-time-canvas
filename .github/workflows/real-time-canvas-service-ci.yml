name: real-time-canvas-service CI

on:
  push:
    branches: [main]
    paths:
      - "real-time-canvas-service/**"
      - ".github/workflows/real-time-canvas-service-ci.yml"
  pull_request:
    paths:
      - "real-time-canvas-service/**"
      - ".github/workflows/real-time-canvas-service-ci.yml"

defaults:
  run:
    working-directory: real-time-canvas-service

concurrency:
  group: service-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, vet & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: real-time-canvas-service/go.mod
          cache-dependency-path: real-time-canvas-service/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # The current test suite is unit-level only (JWT round-trip, WS hub
        # concurrency) with no PostgreSQL/Redis dependency, so no service
        # containers are needed here. Add them alongside real integration
        # tests if that changes.
        run: go test ./... -race -cover

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: real-time-canvas-service/go.mod
          cache-dependency-path: real-time-canvas-service/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.6.2
          working-directory: real-time-canvas-service
